<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>影视榜单 · 海报墙</title>
<style>
  /* 设计：Dark Mode (OLED) · 电影感。海报优先，信息悬停/点击再展开 */
  :root {
    --bg: #0b0b10; --surface: #15151d; --surface-2: #1d1d28; --line: #2a2a38;
    --text: #f4f4f7; --muted: #9a9aae; --accent: #ffb020; --accent-ink: #1a1200;
    --ring: #ffffff; --shadow: 0 10px 30px rgba(0,0,0,.55);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f8; --surface: #ffffff; --surface-2: #ececf2; --line: #dcdce6;
      --text: #14141c; --muted: #5d5d72; --accent: #d97706; --accent-ink: #ffffff;
      --ring: #14141c; --shadow: 0 10px 30px rgba(20,20,40,.18);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  /* ── 顶栏 ── */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 32px); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: .3px; margin-right: auto; }
  .logo svg { width: 22px; height: 22px; color: var(--accent); }
  .field { position: relative; }
  .field svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  input[type=search], select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); outline-offset: 0; }
  input[type=search] { width: clamp(150px, 22vw, 260px); padding: 0 12px 0 34px; }
  input[type=search]::placeholder { color: var(--muted); }
  select { padding: 0 10px; cursor: pointer; }
  .scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { display: none; }
  .tab, .chip { flex: none; border: 0; cursor: pointer; white-space: nowrap; transition: background .18s, color .18s; }
  .tab { height: 40px; padding: 0 16px; border-radius: 20px; background: transparent; color: var(--muted); font-weight: 600; }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }
  .chip { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface); color: var(--muted); font-size: 13px; border: 1px solid var(--line); }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ── 海报墙 ── */
  .meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; padding: 16px 0 6px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(112px, 15vw, 190px), 1fr)); gap: clamp(8px, 1.4vw, 18px); padding: 8px 0 40px; list-style: none; margin: 0; }
  .item { position: relative; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: var(--surface-2); cursor: pointer; isolation: isolate;
    transition: transform .22s ease, box-shadow .22s ease; animation: rise .35s ease both; border: 0; padding: 0; display: block; width: 100%; text-align: left; }
  .item::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%) 0 0/200% 100%; animation: shimmer 1.4s linear infinite; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .35s; }
  .item img.ok { opacity: 1; }
  .rank { position: absolute; left: 0; top: 0; padding: 2px 9px 3px 7px; border-bottom-right-radius: 10px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px); }
  .rank.top { background: var(--accent); color: var(--accent-ink); }
  .score { position: absolute; right: 6px; top: 6px; padding: 1px 7px; border-radius: 8px; background: rgba(0,0,0,.66); color: #ffc94d; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cap { position: absolute; inset: auto 0 0 0; padding: 36px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.55) 55%, transparent); color: #fff;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
  .cap b { display: block; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cap span { font-size: 12px; color: #cfcfdc; }
  .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center; color: var(--muted); font-weight: 600; }
  @media (hover: hover) {
    .item:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow); z-index: 2; }
    .item:hover .cap { opacity: 1; transform: none; }
  }
  .item:focus-visible .cap { opacity: 1; transform: none; }
  /* 触屏：标题常驻，无需悬停 */
  @media (hover: none) { .cap { opacity: 1; transform: none; padding-top: 28px; } .cap span { display: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .state { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 90px 0; }
  #more { height: 1px; }

  /* ── 详情弹层 ── */
  dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: min(880px, 94vw); width: 100%; margin: auto; overflow: visible; }
  dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(6px); }
  .sheet { display: grid; grid-template-columns: minmax(0, 260px) 1fr; background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); max-height: 88vh; position: relative; animation: rise .25s ease both; }
  .sheet .bd { position: absolute; inset: 0; background-size: cover; background-position: center top; opacity: .16; filter: blur(2px); }
  .sheet img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; aspect-ratio: 2/3; background: var(--surface-2); }
  .sheet .body { position: relative; padding: clamp(18px, 3vw, 30px); overflow: auto; }
  .sheet h2 { margin: 0 36px 8px 0; font-size: clamp(20px, 3vw, 28px); line-height: 1.25; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag { padding: 3px 10px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
  .tag.hot { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .sheet p { margin: 0 0 20px; color: var(--muted); white-space: pre-line; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
  .btn:hover { filter: brightness(1.08); }
  .x { position: absolute; right: 10px; top: 10px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: rgba(0,0,0,.7); }
  .x svg { width: 20px; height: 20px; }
  @media (max-width: 620px) { .sheet { grid-template-columns: 1fr; } .sheet img { max-height: 42vh; aspect-ratio: auto; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
        影视榜单
      </div>
      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索标题" aria-label="搜索标题" autocomplete="off">
      </label>
      <select id="sort" aria-label="排序">
        <option value="default">榜单顺序</option>
        <option value="rating">评分最高</option>
        <option value="popularity">热度最高</option>
        <option value="releaseDate">最近发布</option>
      </select>
    </div>
    <div class="scroll" id="tabs" role="tablist" aria-label="榜单来源"></div>
    <div class="scroll" id="chips" aria-label="分类"></div>
  </div>
</header>

<main class="wrap">
  <div class="meta"><span id="count" aria-live="polite"></span><span id="upd"></span></div>
  <ul class="wall" id="wall"></ul>
  <div id="more"></div>
</main>

<dialog id="dlg" aria-labelledby="d-title">
  <div class="sheet">
    <div class="bd" id="d-bd"></div>
    <button class="x" id="d-x" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <img id="d-img" alt="">
    <div class="body">
      <h2 id="d-title"></h2>
      <div class="tags" id="d-tags"></div>
      <p id="d-desc"></p>
      <a class="btn" id="d-link" target="_blank" rel="noopener">在 TMDB 查看 ↗</a>
    </div>
  </div>
</dialog>

<script>
const SOURCES = [
  ["guduo", "骨朵热度"], ["douban", "豆瓣热榜"], ["mgtv", "芒果TV"], ["theater", "剧场平台"],
  ["bangumi", "番剧"], ["tmdb", "TMDB"], ["bili", "B站"], ["mal", "MAL"], ["anilist", "AniList"], ["trakt", "Trakt"],
];
const LABELS = {
  tv: "剧集", movie: "电影", tv_popular: "热门剧集", movie_popular: "热门电影",
  tv_domestic: "大陆剧集", tv_american: "欧美剧集", tv_japanese: "日本剧集", tv_korean: "韩国剧集",
  tv_animation: "动漫番剧", tv_documentary: "纪录片", show_domestic: "大陆综艺", show_foreign: "国外综艺",
  show: "王牌综艺", bangumi: "番剧榜", guochuang: "国创榜", anime: "动画榜", doc: "纪录片榜",
  trending: "剧集趋势", popular: "剧集热门", movie_trending: "电影趋势", movie_popular: "电影热门",
};
const IMG = "https://image.tmdb.org/t/p/";
const PAGE = 48;

const $ = (id) => document.getElementById(id);
const cache = {};
const S = { src: SOURCES[0][0], group: null, groups: [], data: null, list: [], shown: 0 };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function img(p, size) { return !p ? "" : /^https?:/.test(p) ? p : IMG + size + p; }
function titleOf(it) { return it.title || it.tmdbTitle || "未知"; }
function yearOf(it) { return String(it.releaseDate || "").slice(0, 4); }
function typeOf(it) { return (it.mediaType || (it.type === "movie" ? "movie" : "tv")) === "movie" ? "电影" : "剧集"; }

/** 不同源 JSON 结构 → [{key,label,items}] */
function toGroups(src, d) {
  if (!d) return [];
  if (src === "guduo") return Object.entries(d.categories || {}).map(([k, v]) => ({ key: k, label: k, items: v }));
  if (src === "bangumi") return [{ key: "all", label: "排名榜", items: d.hot_anime || [] }];
  if (src === "mal") return [{ key: "all", label: "热播", items: d.airing || [] }];
  if (src === "anilist") return [{ key: "all", label: "热门", items: d.trending || [] }];
  if (src === "theater") {
    return Object.entries(d).filter(([k, v]) => k !== "last_updated" && v && typeof v === "object")
      .map(([k, v]) => ({ key: k, label: k, items: [...(v.upcoming || []), ...(v.aired || [])] }));
  }
  return Object.entries(d).filter(([, v]) => Array.isArray(v)).map(([k, v]) => ({ key: k, label: LABELS[k] || k, items: v }));
}

/* ── 顶部 ── */
function renderTabs() {
  const box = $("tabs"); box.replaceChildren();
  for (const [k, label] of SOURCES) {
    const b = el("button", "tab", label);
    b.role = "tab"; b.setAttribute("aria-selected", k === S.src);
    b.onclick = () => selectSource(k);
    box.appendChild(b);
  }
}
function renderChips() {
  const box = $("chips"); box.replaceChildren();
  box.hidden = S.groups.length < 2;
  for (const g of S.groups) {
    const b = el("button", "chip", g.label);
    b.setAttribute("aria-pressed", g.key === S.group);
    b.onclick = () => { S.group = g.key; syncHash(); renderChips(); build(); };
    box.appendChild(b);
  }
}

/* ── 海报墙（分批渲染 + 无限滚动） ── */
function build() {
  const g = S.groups.find((x) => x.key === S.group);
  const q = $("q").value.trim().toLowerCase();
  const sort = $("sort").value;
  let list = (g ? g.items : []).map((it, i) => ({ it, rank: i + 1 })).filter((x) => x.it.posterPath);
  if (q) list = list.filter((x) => titleOf(x.it).toLowerCase().includes(q));
  if (sort === "releaseDate") list.sort((a, b) => String(b.it.releaseDate || "").localeCompare(String(a.it.releaseDate || "")));
  else if (sort !== "default") list.sort((a, b) => (Number(b.it[sort]) || 0) - (Number(a.it[sort]) || 0));
  S.list = list; S.shown = 0;
  $("wall").replaceChildren();
  $("count").textContent = S.data ? `${list.length} 部作品` : "";
  const upd = S.data && S.data.last_updated;
  $("upd").textContent = upd ? `更新于 ${upd}` : "";
  if (!list.length) {
    $("wall").appendChild(el("li", "state", S.data ? (q ? "没有匹配的作品" : "该榜单暂无带海报的作品") : "该榜单暂无数据"));
    return;
  }
  more();
}

function more() {
  const wall = $("wall"), frag = document.createDocumentFragment();
  const end = Math.min(S.shown + PAGE, S.list.length);
  for (let i = S.shown; i < end; i++) frag.appendChild(card(S.list[i], i - S.shown));
  S.shown = end;
  wall.appendChild(frag);
}

function card({ it, rank }, i) {
  const li = el("li");
  const b = el("button", "item"); b.type = "button";
  b.style.animationDelay = Math.min(i, 20) * 18 + "ms";
  b.setAttribute("aria-label", titleOf(it));
  const im = el("img"); im.alt = ""; im.loading = "lazy"; im.decoding = "async";
  im.onload = () => im.classList.add("ok");
  im.onerror = () => { im.remove(); b.appendChild(el("div", "noimg", titleOf(it))); };
  im.src = img(it.posterPath, "w342");
  b.appendChild(im);
  b.appendChild(el("span", "rank" + (rank <= 3 ? " top" : ""), rank));
  const r = Number(it.rating);
  if (r > 0) b.appendChild(el("span", "score", r.toFixed(1)));
  const cap = el("div", "cap");
  cap.appendChild(el("b", null, titleOf(it)));
  cap.appendChild(el("span", null, [yearOf(it), typeOf(it)].filter(Boolean).join(" · ")));
  b.appendChild(cap);
  b.onclick = () => openDetail(it);
  li.appendChild(b);
  return li;
}

new IntersectionObserver((e) => { if (e[0].isIntersecting && S.shown < S.list.length) more(); }, { rootMargin: "600px" }).observe($("more"));

/* ── 详情 ── */
const dlg = $("dlg");
function openDetail(it) {
  $("d-title").textContent = titleOf(it);
  const im = $("d-img"); im.src = img(it.posterPath, "w500"); im.alt = titleOf(it);
  $("d-bd").style.backgroundImage = it.backdropPath ? `url("${img(it.backdropPath, "w780")}")` : "none";
  const tags = $("d-tags"); tags.replaceChildren();
  const r = Number(it.rating);
  if (r > 0) tags.appendChild(el("span", "tag hot", "★ " + r.toFixed(1)));
  for (const t of [yearOf(it), typeOf(it), it.releaseDate && it.releaseDate.length > 4 ? it.releaseDate : ""].filter(Boolean)) tags.appendChild(el("span", "tag", t));
  $("d-desc").textContent = it.description || it.overview || "暂无简介";
  const id = Number(it.tmdbId || it.id) || 0;
  const link = $("d-link"); link.hidden = !id;
  if (id) link.href = `https://www.themoviedb.org/${typeOf(it) === "电影" ? "movie" : "tv"}/${id}`;
  dlg.showModal();
}
$("d-x").onclick = () => dlg.close();
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // 点击遮罩关闭

/* ── 数据加载 & 路由（#源/分类，可分享） ── */
function syncHash() { history.replaceState(null, "", "#" + encodeURIComponent(S.src) + (S.group ? "/" + encodeURIComponent(S.group) : "")); }

async function selectSource(src, wantGroup) {
  S.src = src; renderTabs();
  $("wall").replaceChildren(el("li", "state", "加载中…"));
  $("count").textContent = ""; $("upd").textContent = "";
  if (!(src in cache)) {
    try { const r = await fetch(`data/${src}.json`, { cache: "no-cache" }); cache[src] = r.ok ? await r.json() : null; }
    catch { cache[src] = null; }
  }
  if (S.src !== src) return; // 加载期间用户已切换
  S.data = cache[src];
  S.groups = toGroups(src, S.data);
  S.group = (S.groups.find((g) => g.key === wantGroup) || S.groups[0] || {}).key || null;
  syncHash(); renderChips(); build();
}

let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(build, 150); };
$("sort").onchange = build;

const [h0, h1] = decodeURIComponent(location.hash.slice(1)).split("/");
selectSource(SOURCES.some(([k]) => k === h0) ? h0 : SOURCES[0][0], h1);
</script>
</body>
</html>
