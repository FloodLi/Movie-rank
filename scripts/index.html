<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全站榜单</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #e11d48; --chip: #eef0f3; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1013; --panel: #171a1f; --text: #eceef2; --muted: #8b93a1; --line: #262b33; --chip: #21262e; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  .grow { flex: 1; }
  input[type=search], select { height: 34px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 0 10px; font: inherit; outline: none; }
  input[type=search] { width: 200px; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  button { height: 34px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 0 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .tabs, .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
  .tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: transparent; color: var(--muted); height: 32px; border-radius: 16px; padding: 0 14px; white-space: nowrap; }
  .tab.on { background: var(--text); color: var(--bg); }
  .tab:hover { color: var(--text); }
  .tab.on:hover { color: var(--bg); }
  .chip { border: 0; background: var(--chip); color: var(--muted); height: 28px; border-radius: 14px; padding: 0 12px; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--accent); color: #fff; }
  .chip.on:hover { color: #fff; }
  .meta { color: var(--muted); font-size: 12px; padding: 14px 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 10px 0 48px; }
  .card { background: var(--panel); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; transition: transform .15s; }
  .card:hover { transform: translateY(-3px); }
  .poster { position: relative; aspect-ratio: 2/3; background: var(--chip); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; color: var(--muted); }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rank { position: absolute; left: 6px; top: 6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: rgba(0,0,0,.62); color: #fff; font-size: 12px; font-weight: 600; line-height: 22px; text-align: center; }
  .rank.top { background: var(--accent); }
  .score { position: absolute; right: 6px; bottom: 6px; padding: 1px 7px; border-radius: 10px; background: rgba(0,0,0,.7); color: #fbbf24; font-size: 12px; font-weight: 600; }
  .info { padding: 8px 10px 10px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 80px 0; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } input[type=search] { width: 130px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>全站榜单</h1>
      <span class="grow"></span>
      <input id="q" type="search" placeholder="搜索标题…">
      <select id="sort">
        <option value="default">默认顺序</option>
        <option value="rating">评分最高</option>
        <option value="popularity">热度最高</option>
        <option value="releaseDate">最近发布</option>
      </select>
      <button id="copy" title="复制 Forward / Rex 模块地址">复制模块地址</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap">
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const SOURCES = [
  ["guduo", "骨朵热度"], ["douban", "豆瓣热榜"], ["mgtv", "芒果TV"], ["theater", "剧场平台"],
  ["bangumi", "番剧"], ["tmdb", "TMDB"], ["bili", "B站"], ["mal", "MAL"], ["anilist", "AniList"], ["trakt", "Trakt"],
];
const LABELS = {
  tv: "剧集", movie: "电影", tv_popular: "热门剧集", movie_popular: "热门电影",
  tv_domestic: "大陆剧集", tv_american: "欧美剧集", tv_japanese: "日本剧集", tv_korean: "韩国剧集",
  tv_animation: "动漫番剧", tv_documentary: "纪录片", show_domestic: "大陆综艺", show_foreign: "国外综艺",
  show: "王牌综艺", bangumi: "番剧榜", guochuang: "国创榜", anime: "动画榜", doc: "纪录片榜",
  trending: "剧集趋势", popular: "剧集热门", movie_trending: "电影趋势", movie_popular: "电影热门",
};
const IMG = "https://image.tmdb.org/t/p/w342";

const $ = (id) => document.getElementById(id);
const cache = {};
let state = { src: SOURCES[0][0], group: null, groups: [], data: null };

/** 把各源不同的 JSON 结构统一成 [{key,label,items}] */
function toGroups(src, d) {
  if (!d) return [];
  if (src === "guduo") return Object.entries(d.categories || {}).map(([k, v]) => ({ key: k, label: k, items: v }));
  if (src === "bangumi") return [{ key: "all", label: "排名榜", items: d.hot_anime || [] }];
  if (src === "mal") return [{ key: "all", label: "热播", items: d.airing || [] }];
  if (src === "anilist") return [{ key: "all", label: "热门", items: d.trending || [] }];
  if (src === "theater") {
    return Object.entries(d).filter(([k, v]) => k !== "last_updated" && v && typeof v === "object")
      .map(([k, v]) => ({ key: k, label: k, items: [...(v.upcoming || []), ...(v.aired || [])] }));
  }
  return Object.entries(d).filter(([, v]) => Array.isArray(v)).map(([k, v]) => ({ key: k, label: LABELS[k] || k, items: v }));
}

function posterUrl(p) {
  if (!p) return "";
  return /^https?:/.test(p) ? p : IMG + p;
}
function year(it) { return String(it.releaseDate || "").slice(0, 4); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderTabs() {
  const box = $("tabs"); box.replaceChildren();
  for (const [k, label] of SOURCES) {
    const b = el("button", "tab" + (k === state.src ? " on" : ""), label);
    b.onclick = () => selectSource(k);
    box.appendChild(b);
  }
}
function renderChips() {
  const box = $("chips"); box.replaceChildren();
  box.style.display = state.groups.length > 1 ? "flex" : "none";
  for (const g of state.groups) {
    const b = el("button", "chip" + (g.key === state.group ? " on" : ""), g.label);
    b.onclick = () => { state.group = g.key; renderChips(); renderGrid(); };
    box.appendChild(b);
  }
}

function renderGrid() {
  const grid = $("grid"); grid.replaceChildren();
  const g = state.groups.find((x) => x.key === state.group);
  const q = $("q").value.trim().toLowerCase();
  const sort = $("sort").value;
  let items = (g ? g.items : []).map((it, i) => ({ ...it, _rank: i + 1 }));
  if (q) items = items.filter((it) => String(it.title || it.tmdbTitle || "").toLowerCase().includes(q));
  if (sort === "releaseDate") items.sort((a, b) => String(b.releaseDate || "").localeCompare(String(a.releaseDate || "")));
  else if (sort !== "default") items.sort((a, b) => (Number(b[sort]) || 0) - (Number(a[sort]) || 0));

  const upd = state.data && state.data.last_updated;
  $("meta").textContent = `${items.length} 部` + (upd ? ` · 更新于 ${upd}` : "");
  if (!items.length) { grid.appendChild(el("div", "empty", state.data ? "没有匹配的内容" : "该榜单暂无数据")); return; }

  const frag = document.createDocumentFragment();
  for (const it of items) {
    const title = it.title || it.tmdbTitle || "未知";
    const id = Number(it.tmdbId || it.id) || 0;
    const mt = it.mediaType || (it.type === "movie" ? "movie" : "tv");
    const a = el("a", "card");
    if (id) { a.href = `https://www.themoviedb.org/${mt}/${id}`; a.target = "_blank"; a.rel = "noopener"; }
    if (it.description || it.overview) a.title = it.description || it.overview;

    const poster = el("div", "poster");
    const url = posterUrl(it.posterPath);
    if (url) {
      const img = el("img"); img.src = url; img.alt = title; img.loading = "lazy";
      img.onerror = () => { img.remove(); poster.prepend(document.createTextNode(title)); };
      poster.appendChild(img);
    } else poster.appendChild(document.createTextNode(title));
    poster.appendChild(el("span", "rank" + (it._rank <= 3 ? " top" : ""), it._rank));
    const r = Number(it.rating);
    if (r > 0) poster.appendChild(el("span", "score", r.toFixed(1)));

    const info = el("div", "info");
    info.appendChild(el("div", "title", title));
    info.appendChild(el("div", "sub", [year(it), mt === "movie" ? "电影" : "剧集"].filter(Boolean).join(" · ")));
    a.append(poster, info);
    frag.appendChild(a);
  }
  grid.appendChild(frag);
}

async function selectSource(src) {
  state.src = src; renderTabs();
  $("grid").replaceChildren(el("div", "empty", "加载中…"));
  if (!(src in cache)) {
    try { const r = await fetch(`data/${src}.json`); cache[src] = r.ok ? await r.json() : null; }
    catch { cache[src] = null; }
  }
  if (state.src !== src) return; // 期间用户已切换
  state.data = cache[src];
  state.groups = toGroups(src, state.data);
  state.group = state.groups.length ? state.groups[0].key : null;
  renderChips(); renderGrid();
}

$("q").oninput = renderGrid;
$("sort").onchange = renderGrid;
$("copy").onclick = async () => {
  const url = new URL("widget.js", location.href).href;
  try { await navigator.clipboard.writeText(url); $("copy").textContent = "已复制 ✓"; }
  catch { prompt("模块地址：", url); }
  setTimeout(() => ($("copy").textContent = "复制模块地址"), 1500);
};
selectSource(state.src);
</script>
</body>
</html>
